<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JAON WORKS — 자온 웍스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 시안 1019 · 캐릭터 소개 — 색은 공개 페이지(웹/jaonworks)의 값을 그대로 쓴다. 새로 쓴 값은 --tile 하나 */
:root{
  --bg:#ededed; --ink:#1a1a1a; --sub:#6f6a62; --line:rgba(26,26,26,.12);
  --tile:#e3e1dc;                 /* 카드 그림 바탕 — 신규 */
  --W:min(1200px, calc(100vw - 56px));
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;line-height:1.7;letter-spacing:-.01em;word-break:keep-all;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{width:var(--W);margin:0 auto}
.en{font-family:Outfit,sans-serif}

/* 상단 바 — 고정하지 않는다. 표지에 얹힌 작은 줄 */
.top{display:flex;justify-content:space-between;align-items:center;height:64px}
.top .mk{font-family:Outfit,sans-serif;font-weight:900;font-size:15px;letter-spacing:-.01em}
.top nav{display:flex;gap:24px;font-family:Outfit,sans-serif;font-size:13px;font-weight:600;letter-spacing:.08em}
.top nav a{opacity:.62;transition:opacity .15s}
.top nav a:hover,.top nav a:focus-visible{opacity:1}

/* 표지 — 타이틀 + 한 줄. 첫 화면 아래쪽에 카드 첫 줄이 걸리도록 낮게 */
.cover{padding:56px 0 64px}
.cover h1{margin:0;font-family:Outfit,sans-serif;font-weight:900;font-size:calc(var(--W) * .148);line-height:.84;letter-spacing:-.025em;white-space:nowrap;margin-left:-.04em}
.cover p{margin:28px 0 0;font-size:17px;font-weight:500;letter-spacing:-.02em}
.cover p span{color:var(--sub);font-weight:400}

/* 섹션 머리 */
.head{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--ink);padding-top:14px;margin-bottom:28px}
.head h2{margin:0;font-family:Outfit,sans-serif;font-size:13px;font-weight:600;letter-spacing:.14em}
.head span{font-size:13px;color:var(--sub)}

/* 멤버 카드 — 4열, 그림 바탕 높이 고정, 모두 같은 바닥선. 키 = --r × 바탕 높이의 86% */
.members{padding-bottom:120px}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:44px 24px}
.card{width:calc((var(--W) - 72px) / 4);margin:0}
.stage{position:relative;height:calc((var(--W) - 72px) / 4 * 1.12);background:var(--tile);border-radius:18px;overflow:hidden}
.stage .no{position:absolute;left:16px;top:12px;font-family:Outfit,sans-serif;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--sub)}
.stage .new{position:absolute;right:14px;top:12px;font-family:Outfit,sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink);border:1px solid var(--ink);border-radius:99px;padding:1px 9px}
.stage .fig{position:absolute;left:50%;bottom:8%;height:calc(90% * var(--r));width:auto;transform:translateX(-50%);transition:transform .22s var(--ease);z-index:1}
.stage:after{content:"";position:absolute;left:50%;bottom:calc(8% - 9px);width:58%;height:22px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(40,35,30,.16),rgba(40,35,30,0) 70%)}
.card:hover .fig{transform:translate(-50%,-4px)}
.card figcaption{padding:16px 4px 0}
.card .nm{display:flex;align-items:baseline;gap:10px;margin:0}
.card .nm b{font-size:20px;font-weight:700;letter-spacing:-.03em}
.card .nm span{font-size:13px;color:var(--sub)}
.card .ln{margin:6px 0 0;font-size:14.5px;line-height:1.65;color:#3a3732}

/* 포스터 — 4:5. 층: 원본 그룹샷(바닥 그림자째) → JAON WORKS 글자 → 같은 자리 누끼. 글자는 캐릭터 뒤로만 간다 */
.posters{padding-bottom:110px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.poster{margin:0;padding:0;border:0;background:none;cursor:zoom-in;display:block;width:100%;text-align:left;border-radius:6px}
.pz{--ty0:21cqw;position:relative;aspect-ratio:4/5;container-type:inline-size;overflow:hidden;background:var(--fill);border-radius:6px;color:var(--ink)}
.pz .ly{position:absolute;left:var(--x);width:var(--w);bottom:0;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.pz .bgi{-webkit-mask-image:var(--mask);mask-image:var(--mask);-webkit-mask-composite:source-in;mask-composite:intersect}
.pz .cut{z-index:2}
.pz .pt{position:absolute;z-index:1;left:0;right:0;top:var(--ty);margin:0;text-align:center;
  font-family:Outfit,sans-serif;font-weight:900;font-size:24cqw;line-height:.82;letter-spacing:-.025em;white-space:nowrap;pointer-events:none}
.pz .pm,.pz .pn{position:absolute;z-index:3;top:3.6cqw;font-size:max(10px,2.3cqw);line-height:1.4;letter-spacing:.02em}
.pz .pm{left:4.4cqw;font-weight:500}
.pz .pn{right:4.4cqw;font-family:Outfit,sans-serif;font-weight:600;letter-spacing:.08em}
.poster:hover .pz,.poster:focus-visible .pz{box-shadow:0 0 0 2px var(--ink)}
.poster:focus-visible{outline:none}
.pz{transition:box-shadow .18s var(--ease);box-shadow:inset 0 0 0 1px rgba(26,26,26,.07)}
.poster:hover .pz,.poster:focus-visible .pz{box-shadow:0 0 0 2px var(--ink)}

/* 크게 보기 */
dialog.lb{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100vw;height:100dvh;margin:0;overflow:hidden}
dialog.lb::backdrop{background:rgba(20,19,17,.86)}
.lb .in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.lb .pz{width:min(calc(100vw - 32px), calc((100dvh - 120px) * .8));cursor:zoom-out;border-radius:4px}
.lb button{position:absolute;z-index:5;background:none;border:0;color:#f4f2ee;font-family:Outfit,sans-serif;font-size:13px;font-weight:600;letter-spacing:.1em;padding:14px 16px;cursor:pointer;opacity:.75;transition:opacity .15s}
.lb button:hover,.lb button:focus-visible{opacity:1}
.lb .x{top:6px;right:8px}
.lb .pv{left:8px;bottom:8px} .lb .nx{right:8px;bottom:8px}
.lb .ct{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);color:#f4f2ee;opacity:.6;font-family:Outfit,sans-serif;font-size:12px;letter-spacing:.1em}

footer{border-top:1px solid var(--line);padding:22px 0 40px;display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub)}
footer b{font-family:Outfit,sans-serif;font-weight:900;color:var(--ink);letter-spacing:-.01em}

a:focus-visible,.poster:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* 1024 — 3열 */
@media (max-width:1100px){
  .card{width:calc((var(--W) - 48px) / 3)}
  .stage{height:calc((var(--W) - 48px) / 3 * 1.12)}
}
/* 768 — 2열, 포스터는 그대로 2열 */
@media (max-width:820px){
  .card{width:calc((var(--W) - 16px) / 2)}
  .stage{height:calc((var(--W) - 16px) / 2 * 1.12)}
  .grid{gap:34px 16px}
  .pgrid{gap:16px}
}
/* 폰 — 표지는 두 줄로 크게, 포스터 1열 */
@media (max-width:560px){
  :root{--W:calc(100vw - 32px)}
  .top{height:56px}
  .top nav{gap:16px;font-size:12px}
  .cover{padding:34px 0 46px}
  .cover h1{font-size:calc(var(--W) * .262);white-space:normal;line-height:.84}
  .cover h1 .sp{display:none}
  .cover h1 .w{display:block}
  .cover p{font-size:15px;margin-top:22px}
  .cover p span{display:block}
  .stage{border-radius:14px}
  .stage .no{left:12px;top:9px;font-size:11px}
  .stage .new{right:10px;top:9px;font-size:10px;padding:0 7px}
  .card figcaption{padding:12px 2px 0}
  .card .nm{flex-direction:column;gap:0}
  .card .nm b{font-size:17px}
  .card .nm span{font-size:12px}
  .card .ln{font-size:13px;line-height:1.6}
  .members{padding-bottom:84px}
  .pgrid{grid-template-columns:1fr;gap:20px}
  .posters{padding-bottom:72px}
  footer{flex-direction:column;gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <a class="mk" href="#">JAON WORKS</a>
    <nav aria-label="페이지 안">
      <a href="#members">MEMBERS</a>
      <a href="#posters">POSTERS</a>
      <a href="https://powerpilferer.github.io/jakka/">JOURNAL</a>
    </nav>
  </header>

  <section class="cover" data-motion="cover">
    <h1><span class="w">JAON</span><span class="sp"> </span><span class="w">WORKS</span></h1>
    <p>AI 요원 열세 명이 일하는 작은 작업실. <span>생김새도 고집도 하나씩.</span></p>
  </section>

  <section class="members" id="members" aria-labelledby="h-members">
    <div class="head"><h2 id="h-members">MEMBERS</h2><span>13</span></div>
    <div class="grid" data-motion="members">
      <!-- 순서 = 공개 페이지 명부 순서(= 포스터 묶음 순서) + 신화방(10.15 합류) -->
      <figure class="card" style="--r:.8333"><div class="stage"><span class="no">01</span><img class="fig" src="img/fig-jaon.webp" alt="자온 전신" width="440" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>자온</b><span>반장</span></p><p class="ln">모든 말은 자온을 지나, 꼭 맞는 사람에게 닿는다.</p></figcaption></figure>
      <figure class="card" style="--r:.9917"><div class="stage"><span class="no">02</span><img class="fig" src="img/fig-kimjakka.webp" alt="김자까 전신" width="313" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>김자까</b><span>전속 작가</span></p><p class="ln">하루가 지나간 자리에 남아 받아 적는다.</p></figcaption></figure>
      <figure class="card" style="--r:.8333"><div class="stage"><span class="no">03</span><img class="fig" src="img/fig-mrkim.webp" alt="미스터김 전신" width="462" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>미스터김</b><span>행정 담당</span></p><p class="ln">서류의 빈칸 앞에서 서두르지 않는다.</p></figcaption></figure>
      <figure class="card" style="--r:.8333"><div class="stage"><span class="no">04</span><img class="fig" src="img/fig-jeombbang.webp" alt="점빵이 전신" width="460" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>점빵이</b><span>저녁 식당 안내</span></p><p class="ln">오늘 저녁 한 끼가 갈 곳을 지도에 꽂아 둔다.</p></figcaption></figure>
      <figure class="card" style="--r:.8333"><div class="stage"><span class="no">05</span><img class="fig" src="img/fig-intaeri.webp" alt="인태리 전신" width="463" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>인태리</b><span>인테리어 총괄</span></p><p class="ln">무드를 줄자로 잰다. 예쁜 공간보다 잘 돌아가는 공간.</p></figcaption></figure>
      <figure class="card" style="--r:.8333"><div class="stage"><span class="no">06</span><img class="fig" src="img/fig-chunbong.webp" alt="춘봉 전신" width="447" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>춘봉</b><span>웹 디자이너</span></p><p class="ln">포토샵 대신 브라우저를 편다. 그린 화면은 제 손으로 세운다.</p></figcaption></figure>
      <figure class="card" style="--r:.825"><div class="stage"><span class="no">07</span><img class="fig" src="img/fig-danbi.webp" alt="단비 전신" width="404" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>단비</b><span>기획 파트너</span></p><p class="ln">서두르는 손을 한 번 붙잡는다. 무엇을, 왜, 누구를 위해.</p></figcaption></figure>
      <figure class="card" style="--r:1"><div class="stage"><span class="no">08</span><img class="fig" src="img/fig-moa.webp" alt="모아 전신" width="535" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>모아</b><span>레퍼런스 수집가</span></p><p class="ln">좋은 장면을 하루 열 장씩 주워 온다. 써먹을 것만.</p></figcaption></figure>
      <figure class="card" style="--r:.8333"><div class="stage"><span class="no">09</span><img class="fig" src="img/fig-jusiki.webp" alt="주식이 전신" width="429" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>주식이</b><span>주식 브리핑</span></p><p class="ln">눈여겨본 종목의 오르내림을 아침 한 장으로 건넨다.</p></figcaption></figure>
      <figure class="card" style="--r:.8417"><div class="stage"><span class="no">10</span><img class="fig" src="img/fig-miji.webp" alt="미지 전신" width="483" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>미지</b><span>이미지 담당</span></p><p class="ln">몇 장을 뽑든 마음은 한 장에 건다. 그게 미지의 픽.</p></figcaption></figure>
      <figure class="card" style="--r:.8333"><div class="stage"><span class="no">11</span><img class="fig" src="img/fig-moseon.webp" alt="모선 전신" width="489" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>모선</b><span>모션 담당</span></p><p class="ln">멈춘 그림에 시간을 입힌다. 움직임은 적을수록 좋다.</p></figcaption></figure>
      <figure class="card" style="--r:.8333"><div class="stage"><span class="no">12</span><img class="fig" src="img/fig-agenth.webp" alt="요원 H 전신" width="442" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>요원 H</b><span>해결사</span></p><p class="ln">어려운 날에만 나타난다. 일이 풀리면 이미 자리에 없다.</p></figcaption></figure>
      <figure class="card" style="--r:.85"><div class="stage"><span class="no">13</span><span class="new">NEW</span><img class="fig" src="img/fig-shinhwa.webp" alt="신화방 전신" width="462" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>신화방</b><span>그림 작가</span></p><p class="ln">사진이 닿지 않는 곳을 선으로 그린다.</p></figcaption></figure>
    </div>
  </section>

  <section class="posters" id="posters" aria-labelledby="h-posters">
    <div class="head"><h2 id="h-posters">POSTERS</h2><span>셋씩 모인 단체 사진 · 누르면 크게</span></div>
    <div class="pgrid" data-motion="posters">
      <!-- --x/--w = 그림 층 가로 자리(프레임 대비), --ty = 글자 윗선. 그룹1은 3:4라 66%로 세워 머리 높이를 다른 셋과 맞춘다 -->
      <button class="poster" type="button" aria-label="포스터 01 크게 보기 — 자온, 김자까, 미스터김">
        <div class="pz" style="--fill:#eeeeee;--x:17%;--w:66%;--ty:var(--ty0);--mask:linear-gradient(to right,transparent,#000 22%,#000 78%,transparent),linear-gradient(to bottom,transparent,#000 14%)">
          <img class="ly bgi" src="img/group1.webp" alt="" width="896" height="1200">
          <p class="pt" aria-hidden="true">JAON<br>WORKS</p>
          <img class="ly cut" src="img/group1-cut.webp" alt="자온, 김자까, 미스터김 단체 사진" width="896" height="1200">
          <span class="pm">자온 · 김자까 · 미스터김</span><span class="pn">01 / 04</span>
        </div>
      </button>
      <button class="poster" type="button" aria-label="포스터 02 크게 보기 — 점빵이, 인태리, 춘봉">
        <div class="pz" style="--fill:linear-gradient(90deg,rgb(200,209,192),rgb(203,212,196) 25%,rgb(205,214,200) 50%,rgb(206,214,199) 75%,rgb(204,213,196));--x:0%;--w:100%;--ty:var(--ty0);--mask:linear-gradient(to bottom,transparent,#000 10%),linear-gradient(#000,#000)">
          <img class="ly bgi" src="img/group2.webp" alt="" width="1024" height="1024">
          <p class="pt" aria-hidden="true">JAON<br>WORKS</p>
          <img class="ly cut" src="img/group2-cut.webp" alt="점빵이, 인태리, 춘봉 단체 사진" width="1024" height="1024">
          <span class="pm">점빵이 · 인태리 · 춘봉</span><span class="pn">02 / 04</span>
        </div>
      </button>
      <button class="poster" type="button" aria-label="포스터 03 크게 보기 — 단비, 모아, 주식이">
        <div class="pz" style="--fill:linear-gradient(90deg,rgb(231,216,193),rgb(237,225,200) 25%,rgb(241,229,205) 50%,rgb(238,226,203) 75%,rgb(234,219,197));--x:0%;--w:100%;--ty:var(--ty0);--mask:linear-gradient(to bottom,transparent,#000 10%),linear-gradient(#000,#000)">
          <img class="ly bgi" src="img/group3.webp" alt="" width="1024" height="1024">
          <p class="pt" aria-hidden="true">JAON<br>WORKS</p>
          <img class="ly cut" src="img/group3-cut.webp" alt="단비, 모아, 주식이 단체 사진" width="1024" height="1024">
          <span class="pm">단비 · 모아 · 주식이</span><span class="pn">03 / 04</span>
        </div>
      </button>
      <button class="poster" type="button" aria-label="포스터 04 크게 보기 — 미지, 모선, 요원 H">
        <div class="pz" style="--fill:linear-gradient(90deg,rgb(239,230,210),rgb(246,237,219) 25%,rgb(247,239,222) 50%,rgb(246,237,219) 75%,rgb(240,232,210));--x:0%;--w:100%;--ty:var(--ty0);--mask:linear-gradient(to bottom,transparent,#000 10%),linear-gradient(#000,#000)">
          <img class="ly bgi" src="img/group4.webp" alt="" width="1024" height="1024">
          <p class="pt" aria-hidden="true">JAON<br>WORKS</p>
          <img class="ly cut" src="img/group4-cut.webp" alt="미지, 모선, 요원 H 단체 사진" width="1024" height="1024">
          <span class="pm">미지 · 모선 · 요원 H</span><span class="pn">04 / 04</span>
        </div>
      </button>
    </div>
  </section>

  <footer>
    <span><b>JAON WORKS</b></span>
    <span>그림 미지 · 글 김자까</span>
  </footer>
</div>

<dialog class="lb" aria-label="포스터 크게 보기">
  <div class="in"></div>
  <button class="x" type="button">CLOSE</button>
  <button class="pv" type="button" aria-label="이전 포스터">← PREV</button>
  <button class="nx" type="button" aria-label="다음 포스터">NEXT →</button>
  <span class="ct"></span>
</dialog>

<script>
(() => {
  const ps = [...document.querySelectorAll('.poster')];
  const lb = document.querySelector('.lb'), box = lb.querySelector('.in'), ct = lb.querySelector('.ct');
  let i = 0, opener = null;
  const show = n => {
    i = (n + ps.length) % ps.length;
    box.replaceChildren(ps[i].querySelector('.pz').cloneNode(true));
    ct.textContent = String(i + 1).padStart(2, '0') + ' / 0' + ps.length;
  };
  ps.forEach((p, n) => p.addEventListener('click', () => { opener = p; show(n); lb.showModal(); }));
  box.addEventListener('click', () => lb.close());
  lb.addEventListener('click', e => { if (e.target === lb) lb.close(); });
  lb.querySelector('.x').addEventListener('click', () => lb.close());
  lb.querySelector('.pv').addEventListener('click', () => show(i - 1));
  lb.querySelector('.nx').addEventListener('click', () => show(i + 1));
  lb.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') show(i - 1); if (e.key === 'ArrowRight') show(i + 1); });
  lb.addEventListener('close', () => opener && opener.focus());
})();
</script>
</body>
</html>
