<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JAON WORKS — 자온 웍스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 시안 1019 · 캐릭터 소개 — 색은 공개 페이지(웹/jaonworks)의 값을 그대로 쓴다. 새로 쓴 값은 --tile 하나 */
:root{
  --bg:#ededed; --ink:#1a1a1a; --sub:#6f6a62; --line:rgba(26,26,26,.12);
  --tile:#e3e1dc;                 /* 카드 그림 바탕 — 신규 */
  --W:min(1200px, calc(100vw - 56px));
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;line-height:1.7;letter-spacing:-.01em;word-break:keep-all;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{width:var(--W);margin:0 auto}
.en{font-family:Outfit,sans-serif}

/* 상단 바 — 상단 고정(10-20). 배경은 화면 폭 전체로 깐다 */
.top{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;height:76px}
.top::before{content:"";position:absolute;top:0;bottom:0;left:calc(50% - 50vw);right:calc(50% - 50vw);background:var(--bg);z-index:-1}
.top .mk{font-family:Outfit,sans-serif;font-weight:900;font-size:20px;letter-spacing:-.01em}
.top nav{display:flex;gap:30px;font-family:Outfit,sans-serif;font-size:15px;font-weight:600;letter-spacing:.08em}
section[id]{scroll-margin-top:92px}
.top nav a{opacity:.62;transition:opacity .15s}
.top nav a:hover,.top nav a:focus-visible{opacity:1}

/* 표지 — 타이틀 + 한 줄. 첫 화면 아래쪽에 카드 첫 줄이 걸리도록 낮게 */
.cover{padding:56px 0 64px}
.cover h1{margin:0;font-family:Outfit,sans-serif;font-weight:900;font-size:calc(var(--W) * .148);line-height:.84;letter-spacing:-.025em;white-space:nowrap;margin-left:-.04em}
.cover p{margin:28px 0 0;font-size:17px;font-weight:500;letter-spacing:-.02em}
.cover p span{color:var(--sub);font-weight:400}

/* 섹션 머리 */
.head{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--ink);padding-top:14px;margin-bottom:28px}
.head h2{margin:0;font-family:Outfit,sans-serif;font-size:13px;font-weight:600;letter-spacing:.14em}
.head span{font-size:13px;color:var(--sub)}

/* 멤버 카드 — 4열, 그림 바탕 높이 고정. 키 = --r × 바탕 높이의 70%, 그림은 바탕 정중앙(10/27 3R "사각라인 안에서 가운데 정렬") — 최대 키(모아) 위아래 15%.
   누끼는 알파 bbox 크롭(그림자 없음)이라 그림 상자 중심 = 몸통의 시각 중심. 바닥 그림자(.stage:after)는 각 그림의 발 밑을 따라간다(50% − 35%×--r) */
.members{padding-bottom:120px}
.grid{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:44px 24px}
.card{width:calc((var(--W) - 72px) / 4);margin:0}
.stage{position:relative;height:calc((var(--W) - 72px) / 4 * 1.12);background:var(--tile);border-radius:18px;overflow:hidden}
.stage .no{position:absolute;left:16px;top:12px;font-family:Outfit,sans-serif;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--sub)}
.stage .new{position:absolute;right:14px;top:12px;font-family:Outfit,sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink);border:1px solid var(--ink);border-radius:99px;padding:1px 9px}
.stage .fig{position:absolute;left:50%;top:50%;height:calc(70% * var(--r));width:auto;transform:translate(-50%,-50%);transition:transform .22s var(--ease);z-index:1}
.stage:after{content:"";position:absolute;left:50%;bottom:calc(50% - 35% * var(--r) - 9px);width:calc(58% * var(--r));height:22px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(40,35,30,.16),rgba(40,35,30,0) 70%)}
.card:hover .fig{transform:translate(-50%,calc(-50% - 4px))}
/* 10/27 포즈 레이어 보류(사장님 "오버기능은 일단 보류. 현재는 한컷씩밖에 없으니") — 새 포즈 컷이 오면 아래 주석을 풀고 마크업에 .pose 를 되살린다.
   10/19 사장님 "오버했을 때 각자 포즈로" → "모션이 이상해, 그냥 띡 바뀌게" — 전환 효과 없이 즉시 교체. 폰은 탭으로
.stage .pose{position:absolute;left:50%;top:50%;height:calc(70% * var(--r));max-width:94%;object-fit:contain;object-position:bottom;
  transform:translateX(-50%);visibility:hidden;z-index:2;pointer-events:none}
.card.포즈:has(.pose) .fig{visibility:hidden}
.card.포즈 .pose{visibility:visible}
.card:has(.pose):hover .fig{transform:translateX(-50%)}
*/
.card{cursor:pointer}   /* 10/19 "피씨도 클릭으로, 둘 다 토글" — 누르면 한 줄 ↔ 하는 일 (포즈 교체는 보류 중) */
.card .job{display:none;margin:0}
.card .job em{display:block;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink);opacity:.5;margin-bottom:3px}
.card.포즈 .ln{display:none}
.card.포즈 .job{display:block}
.card figcaption{padding:16px 4px 0}
.card .nm{display:flex;align-items:baseline;gap:10px;margin:0}
.card .nm b{font-size:20px;font-weight:700;letter-spacing:-.03em}
.card .nm span{font-size:13px;color:var(--sub)}
.card .ln,.card.포즈 .job{margin:6px 0 0;font-size:14.5px;line-height:1.65;color:#3a3732}

/* 포스터 — 4:5. 층: 원본 그룹샷(바닥 그림자째) → JAON WORKS 글자 → 같은 자리 누끼. 글자는 캐릭터 뒤로만 간다. 10/27 3장(1:1 원본, 위 25cqw 는 --fill) */
.posters{padding-bottom:110px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.poster{margin:0;padding:0;border:0;background:none;cursor:zoom-in;display:block;width:100%;text-align:left;border-radius:6px}
.pz{--ty0:21cqw;position:relative;aspect-ratio:4/5;container-type:inline-size;overflow:hidden;background:var(--fill);border-radius:6px;color:var(--ink)}
.pz .ly{position:absolute;left:var(--x);width:var(--w);max-width:none;bottom:0;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.pz .bgi{-webkit-mask-image:var(--mask);mask-image:var(--mask);-webkit-mask-composite:source-in;mask-composite:intersect}
.pz .cut{z-index:2}
.pz .pt{position:absolute;z-index:1;left:0;right:0;top:var(--ty);margin:0;text-align:center;
  font-family:Outfit,sans-serif;font-weight:900;font-size:24cqw;line-height:.82;letter-spacing:-.025em;white-space:nowrap;pointer-events:none}
.pz .pm,.pz .pn{position:absolute;z-index:3;top:3.6cqw;font-size:max(10px,2.3cqw);line-height:1.4;letter-spacing:.02em}
.pz .pm{left:4.4cqw;font-weight:700;font-size:max(12px,3cqw);letter-spacing:-.01em}
.pz .pm small{display:block;margin-top:.35em;font-size:max(10px,2.1cqw);font-weight:500;opacity:.55;letter-spacing:.02em}   /* 10/19 소제목 아래 이름 */
.pz .pn{right:4.4cqw;font-family:Outfit,sans-serif;font-weight:600;letter-spacing:.08em}
.poster:hover .pz,.poster:focus-visible .pz{box-shadow:0 0 0 2px var(--ink)}
.poster:focus-visible{outline:none}
.pz{transition:box-shadow .18s var(--ease);box-shadow:inset 0 0 0 1px rgba(26,26,26,.07)}
.poster:hover .pz,.poster:focus-visible .pz{box-shadow:0 0 0 2px var(--ink)}

/* 크게 보기 */
dialog.lb{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100vw;height:100dvh;margin:0;overflow:hidden}
dialog.lb::backdrop{background:rgba(20,19,17,.86)}
.lb .in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.lb .pz{width:min(calc(100vw - 32px), calc((100dvh - 120px) * .8));cursor:zoom-out;border-radius:4px}
.lb button{position:absolute;z-index:5;background:none;border:0;color:#f4f2ee;font-family:Outfit,sans-serif;font-size:13px;font-weight:600;letter-spacing:.1em;padding:14px 16px;cursor:pointer;opacity:.75;transition:opacity .15s}
.lb button:hover,.lb button:focus-visible{opacity:1}
.lb .x{top:6px;right:8px}
.lb .pv{left:8px;bottom:8px} .lb .nx{right:8px;bottom:8px}
.lb .ct{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);color:#f4f2ee;opacity:.6;font-family:Outfit,sans-serif;font-size:12px;letter-spacing:.1em}

footer{border-top:1px solid var(--line);padding:22px 0 40px;display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub)}
footer b{font-family:Outfit,sans-serif;font-weight:900;color:var(--ink);letter-spacing:-.01em}

a:focus-visible,.poster:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* 1024 — 3열 */
@media (max-width:1100px){
  .card{width:calc((var(--W) - 48px) / 3)}
  .stage{height:calc((var(--W) - 48px) / 3 * 1.12)}
}
/* 768 — 2열, 포스터는 그대로 2열 */
@media (max-width:820px){
  .card{width:calc((var(--W) - 16px) / 2)}
  .stage{height:calc((var(--W) - 16px) / 2 * 1.12)}
  .grid{gap:34px 16px}
  .pgrid{gap:16px}
}
/* 폰 — 표지는 두 줄로 크게, 포스터 1열 */
@media (max-width:560px){
  :root{--W:calc(100vw - 32px)}
  .top{height:62px}
  .top .mk{font-size:17px}
  .top nav{gap:14px;font-size:12.5px;letter-spacing:.05em}
  section[id]{scroll-margin-top:72px}
  .cover{padding:34px 0 46px}
  .cover h1{font-size:calc(var(--W) * .262);white-space:normal;line-height:.84}
  .cover h1 .sp{display:none}
  .cover h1 .w{display:block}
  .cover p{font-size:15px;margin-top:22px}
  .cover p span{display:block}
  .stage{border-radius:14px}
  .stage .no{left:12px;top:9px;font-size:11px}
  .stage .new{right:10px;top:9px;font-size:10px;padding:0 7px}
  .card figcaption{padding:12px 2px 0}
  .card .nm{flex-direction:column;gap:0}
  .card .nm b{font-size:17px}
  .card .nm span{font-size:12px}
  .card .ln,.card.포즈 .job{font-size:13px;line-height:1.6}
  .members{padding-bottom:84px}
  .pgrid{grid-template-columns:1fr;gap:20px}
  .posters{padding-bottom:72px}
  footer{flex-direction:column;gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <a class="mk" href="#">JAON WORKS</a>
    <nav aria-label="페이지 안">
      <a href="#members">MEMBERS</a>
      <a href="#posters">POSTERS</a>
      <a href="https://powerpilferer.github.io/jakka/">JOURNAL</a>
    </nav>
  </header>

  <section class="cover" data-motion="cover">
    <h1><span class="w">JAON</span><span class="sp"> </span><span class="w">WORKS</span></h1>
    <p>AI 요원 열다섯 명이 일하는 작은 작업실. <span>생김새도 고집도 하나씩.</span></p>
  </section>

  <section class="members" id="members" aria-labelledby="h-members">
    <div class="head"><h2 id="h-members">MEMBERS</h2><span>15</span></div>
    <div class="grid" data-motion="members">
      <!-- 순서 = 공개 페이지 명부 순서 + 합류순(신화방 10.15 · 신총무·치수정 10.27). --r = 통합앱/도구/전신프로필.py 표×키배율 ÷ 최대(모아). 10/27 사장님 지시로 사이트만 요원 H 1.06·신총무 1.02·김자까 1.17·주식이 0.93 (전신.py 사이트키). 재생성: 디자인개편/갱신-1027/도구/전신.py
           호버/탭 포즈 레이어(pose-*.webp)는 10.27 보류 — 옛 그룹샷 컷이라 지금 캐릭터와 안 맞음. 다시 켤 땐 .fig 뒤에 <img class="pose" src="img/pose-이름.webp" alt="" aria-hidden="true"> 를 넣고 아래 CSS 주석을 푼다 -->
      <figure class="card" style="--r:.798"><div class="stage"><span class="no">01</span><img class="fig" src="img/fig-jaon.webp" alt="자온 전신" width="452" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>자온</b><span>반장</span></p><p class="ln">모든 말은 자온을 지나, 꼭 맞는 사람에게 닿는다.</p><p class="job"><em>하는 일</em>사장님 말을 받아 요원들에게 일을 나누고, 결과를 모아 정리해 보고한다.</p></figcaption></figure>
      <figure class="card" style="--r:.9336"><div class="stage"><span class="no">02</span><img class="fig" src="img/fig-kimjakka.webp" alt="김자까 전신" width="378" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>김자까</b><span>전속 작가</span></p><p class="ln">하루가 지나간 자리에 남아 받아 적는다.</p><p class="job"><em>하는 일</em>에세이·블로그 글을 쓰고, 작업 결과를 읽기 쉬운 노트로 정리한다.</p></figcaption></figure>
      <figure class="card" style="--r:.798"><div class="stage"><span class="no">03</span><img class="fig" src="img/fig-mrkim.webp" alt="미스터김 전신" width="497" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>미스터김</b><span>행정 담당</span></p><p class="ln">서류의 빈칸 앞에서 서두르지 않는다.</p><p class="job"><em>하는 일</em>지출결의서·휴가 신청 같은 회사 서류를 양식에 맞춰 준비한다.</p></figcaption></figure>
      <figure class="card" style="--r:.8458"><div class="stage"><span class="no">04</span><img class="fig" src="img/fig-jeombbang.webp" alt="점빵이 전신" width="500" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>점빵이</b><span>저녁 식당 안내</span></p><p class="ln">오늘 저녁 한 끼가 갈 곳을 지도에 꽂아 둔다.</p><p class="job"><em>하는 일</em>매일 오후, 그날 저녁 갈 식당 한 곳을 골라 맛지도에 올린다.</p></figcaption></figure>
      <figure class="card" style="--r:.8458"><div class="stage"><span class="no">05</span><img class="fig" src="img/fig-intaeri.webp" alt="인태리 전신" width="539" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>인태리</b><span>인테리어 총괄</span></p><p class="ln">무드를 줄자로 잰다. 예쁜 공간보다 잘 돌아가는 공간.</p><p class="job"><em>하는 일</em>매장의 컨셉·평면·자재·조명을 잡고 현장 사진을 검토한다.</p></figcaption></figure>
      <figure class="card" style="--r:.8458"><div class="stage"><span class="no">06</span><img class="fig" src="img/fig-chunbong.webp" alt="춘봉 전신" width="484" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>춘봉</b><span>웹 디자이너</span></p><p class="ln">포토샵 대신 브라우저를 편다. 그린 화면은 제 손으로 세운다.</p><p class="job"><em>하는 일</em>기획과 시안을 받아 웹페이지를 디자인하고 직접 코드로 만든다.</p></figcaption></figure>
      <figure class="card" style="--r:.6384"><div class="stage"><span class="no">07</span><img class="fig" src="img/fig-danbi.webp" alt="단비 전신" width="545" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>단비</b><span>기획 파트너</span></p><p class="ln">서두르는 손을 한 번 붙잡는다. 무엇을, 왜, 누구를 위해.</p><p class="job"><em>하는 일</em>새 프로젝트 전에 목적·타깃·범위를 같이 고민해 기획서로 남긴다.</p></figcaption></figure>
      <figure class="card" style="--r:1"><div class="stage"><span class="no">08</span><img class="fig" src="img/fig-moa.webp" alt="모아 전신" width="501" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>모아</b><span>레퍼런스 수집가</span></p><p class="ln">좋은 장면을 하루 열 장씩 주워 온다. 써먹을 것만.</p><p class="job"><em>하는 일</em>디자인 사이트와 핀터레스트에서 레퍼런스를 모아 볼 만한 것을 골라 준다.</p></figcaption></figure>
      <figure class="card" style="--r:.7421"><div class="stage"><span class="no">09</span><img class="fig" src="img/fig-jusiki.webp" alt="주식이 전신" width="657" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>주식이</b><span>주식 브리핑</span></p><p class="ln">눈여겨본 종목의 오르내림을 아침 한 장으로 건넨다.</p><p class="job"><em>하는 일</em>관심 종목 등락과 뉴스를 확인해 아침 브리핑을 만든다.</p></figcaption></figure>
      <figure class="card" style="--r:.616"><div class="stage"><span class="no">10</span><img class="fig" src="img/fig-miji.webp" alt="미지 전신" width="592" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>미지</b><span>이미지 담당</span></p><p class="ln">몇 장을 뽑든 마음은 한 장에 건다. 그게 미지의 픽.</p><p class="job"><em>하는 일</em>모델 컷·캐릭터·제품 이미지를 AI로 만들고 시안을 여러 장 뽑는다.</p></figcaption></figure>
      <figure class="card" style="--r:.2934"><div class="stage"><span class="no">11</span><img class="fig" src="img/fig-moseon.webp" alt="모선 전신" width="594" height="640" loading="lazy"></div>
        <figcaption><p class="nm"><b>모선</b><span>모션 담당</span></p><p class="ln">멈춘 그림에 시간을 입힌다. 움직임은 적을수록 좋다.</p><p class="job"><em>하는 일</em>웹 화면 애니메이션과 캐릭터 움직임을 설계하고 만든다.</p></figcaption></figure>
      <figure class="card" style="--r:.8458"><div class="stage"><span class="no">12</span><img class="fig" src="img/fig-agenth.webp" alt="요원 H 전신" width="441" height="640" loading="lazy"></div>

<dialog class="lb" aria-label="포스터 크게 보기">
  <div class="in"></div>
  <button class="x" type="button">CLOSE</button>
  <button class="pv" type="button" aria-label="이전 포스터">← PREV</button>
  <button class="nx" type="button" aria-label="다음 포스터">NEXT →</button>
  <span class="ct"></span>
</dialog>

<script>
(() => {
  const ps = [...document.querySelectorAll('.poster')];
  const lb = document.querySelector('.lb'), box = lb.querySelector('.in'), ct = lb.querySelector('.ct');
  let i = 0, opener = null;
  const pad = n => String(n).padStart(2, '0'), N = pad(ps.length);
  ps.forEach((p, n) => {   /* 10/27 번호는 DOM 순서대로 — 포스터를 더 넣어도 "01 / 03" 이 따라온다 */
    p.querySelector('.pn').textContent = pad(n + 1) + ' / ' + N;
    p.setAttribute('aria-label', '포스터 ' + pad(n + 1) + ' ' + p.getAttribute('aria-label'));
  });
  const show = n => {
    i = (n + ps.length) % ps.length;
    box.replaceChildren(ps[i].querySelector('.pz').cloneNode(true));
    ct.textContent = pad(i + 1) + ' / ' + N;
  };
  ps.forEach((p, n) => p.addEventListener('click', () => { opener = p; show(n); lb.showModal(); }));
  box.addEventListener('click', () => lb.close());
  lb.addEventListener('click', e => { if (e.target === lb) lb.close(); });
  lb.querySelector('.x').addEventListener('click', () => lb.close());
  lb.querySelector('.pv').addEventListener('click', () => show(i - 1));
  lb.querySelector('.nx').addEventListener('click', () => show(i + 1));
  lb.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') show(i - 1); if (e.key === 'ArrowRight') show(i + 1); });
  lb.addEventListener('close', () => opener && opener.focus());
})();
</script>
<script>/* 카드를 누르면 한 줄 ↔ 하는 일 (PC·폰 모두 토글, 10/19) */
